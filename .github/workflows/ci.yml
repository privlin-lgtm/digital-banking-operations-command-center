name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w apps/api

      - name: Dependency audit
        # Critical only, for now — `npm audit --audit-level=high` still fails
        # on one known, pre-existing transitive finding (deepmerge-ts via
        # @prisma/config's dev-only CLI tooling). It is a real CVE but does
        # not process untrusted input at runtime in this app — fixing it
        # means a breaking prisma major bump, which deserves its own reviewed
        # change. The other finding this gate was relaxed for (postcss via
        # next's build-time CSS pipeline) was cleared by the Next 16 upgrade.
        # Gating at "critical" for now still catches anything newly
        # introduced at the severity that actually warrants blocking a merge;
        # ratchet to "high" once prisma is upgraded.
        run: npm audit --audit-level=critical

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
