global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  - job_name: bankops-api
    metrics_path: /api/v1/metrics
    scrape_interval: 10s
    static_configs:
      - targets: ['api:4000']
        labels:
          service: bankops-api
          env: local
