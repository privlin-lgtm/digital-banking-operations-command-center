name: CD

# Closes the "no CD pipeline" P1 finding from the production-readiness
# audit: CI validated every push but nothing built or published an
# artifact, so there was no traceable record of what was actually built
# from a given commit — deployment was an undocumented manual act.
#
# This publishes a git-sha-tagged image to GitHub Container Registry on
# every push to main/master, after CI's own checks pass. It deliberately
# stops there: there is no real deploy target for this project (no cloud
# account, no cluster), so "deploy" here means "produce a traceable,
# pullable artifact," not "roll it out somewhere." Rollback in this model
# is `docker pull ghcr.io/<repo>:<previous-sha>` — a real capability, just
# not an automated one, because there's nowhere real to automate it onto.

on:
  push:
    branches: [main, master]
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main, master]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest
    # Only proceed if this run was triggered by CI succeeding, or (for the
    # workflow_run trigger specifically) if CI's conclusion was success.
    if: github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: read
      packages: write
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.sha }}
            ghcr.io/${{ github.repository }}/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Image published" >> "$GITHUB_STEP_SUMMARY"
          echo "\`ghcr.io/${{ github.repository }}/api:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback = redeploy an earlier tag from this registry — there is no automated rollout target for this project, so this is the traceable artifact, not a live deployment." >> "$GITHUB_STEP_SUMMARY"
