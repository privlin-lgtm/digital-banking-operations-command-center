auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # A local single-node demo has no reason to reject a burst from a
  # container restart storm — raise the ingestion ceilings rather than
  # silently dropping log lines during exactly the event you'd want them for.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32
  retention_period: 168h
