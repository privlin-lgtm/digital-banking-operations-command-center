name: bankops-control-center

services:
  postgres:
    image: postgres:16-alpine
    container_name: bankops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bankops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bankops}
      POSTGRES_DB: ${POSTGRES_DB:-bankops}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-bankops} -d ${POSTGRES_DB:-bankops}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - bankops

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: bankops-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-bankops}:${POSTGRES_PASSWORD:-bankops}@postgres:5432/${POSTGRES_DB:-bankops}?schema=public
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - '${API_PORT:-4000}:4000'
    depends_on:
      postgres:
        condition: service_healthy
    # /health always answers 200 by design (see apps/api's Dockerfile note);
    # /ready is the one that fails non-200 when the database is down.
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:4000/api/v1/ready']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - bankops

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    container_name: bankops-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    ports:
      - '3000:3000'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - bankops

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: bankops-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - '9090:9090'
    depends_on:
      - api
    networks:
      - bankops

  grafana:
    image: grafana/grafana:11.3.0
    container_name: bankops-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
      GF_SERVER_ROOT_URL: http://localhost:3001
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - '3001:3000'
    depends_on:
      - prometheus
    networks:
      - bankops

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  bankops:
    driver: bridge
